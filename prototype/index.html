<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="robots"
      content="noindex"
    />
    <meta
      name="description"
      content="Try the Open AIQ web dashboard and mobile app with mock data. No sign-in needed."
    />
    <title>Open AIQ prototype</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <!-- Copied from src/styles/tokens.css at build time, so colors stay in step. -->
    <link
      rel="stylesheet"
      href="tokens.css"
    />
    <script>
      // Follow the system theme with the same `.dark` class the dashboard uses.
      const dark = window.matchMedia('(prefers-color-scheme: dark)')
      const applyTheme = () => document.documentElement.classList.toggle('dark', dark.matches)
      applyTheme()
      dark.addEventListener('change', applyTheme)
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font:
          15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      a {
        color: inherit;
      }

      /* The top bar follows the app shell: mark, title, then one control. */
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: var(--background);
      }
      .mark {
        display: grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      .title {
        flex: 1;
        min-width: 0;
      }
      .title h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title p {
        margin: 0;
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .switch {
        display: flex;
        flex: none;
        padding: 3px;
        border-radius: 999px;
        background: var(--muted);
      }
      .switch button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        transition:
          background-color 0.2s,
          color 0.2s;
      }
      .switch button[aria-checked='true'] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: var(--shadow-rest);
      }
      .switch button:focus-visible,
      .screen select:focus-visible,
      .open:focus-visible,
      .mark:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--ring) 50%, transparent);
        outline-offset: 2px;
      }
      .switch svg {
        width: 16px;
        height: 16px;
      }

      /* The Screen picker: a native select dressed as a pill next to the switch. */
      .screen {
        position: relative;
        flex: none;
        min-width: 0;
      }
      .screen select {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        max-width: 240px;
        height: 38px;
        padding: 0 34px 0 14px;
        border: 0;
        border-radius: 999px;
        background: var(--muted);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .screen select:hover {
        background: color-mix(in srgb, var(--muted), var(--foreground) 6%);
      }
      .screen option {
        background: var(--popover);
        color: var(--popover-foreground);
      }
      .screen svg {
        position: absolute;
        top: 50%;
        right: 12px;
        width: 16px;
        height: 16px;
        transform: translateY(-50%);
        color: var(--muted-foreground);
        pointer-events: none;
      }
      :root.dark {
        color-scheme: dark;
      }

      .open {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        color: var(--muted-foreground);
      }
      .open:hover {
        background: var(--muted);
        color: var(--foreground);
      }

      main {
        flex: 1;
        min-height: 0;
        position: relative;
        background:
          radial-gradient(
            circle at 0% 0%,
            color-mix(in srgb, var(--chart-1) 9%, transparent),
            transparent 40%
          ),
          radial-gradient(
            circle at 100% 100%,
            color-mix(in srgb, var(--chart-2) 9%, transparent),
            transparent 40%
          );
      }
      .view {
        position: absolute;
        inset: 0;
      }
      main .view[hidden] {
        display: none;
      }
      .view iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--background);
      }

      /* Mobile sits in a phone-sized frame, scaled to fit the window. */
      .view.mobile {
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .phone {
        /* A 390 × 844 screen inside a 10px bezel and 2px outline. On short
           windows the phone gets shorter, never narrower. */
        width: min(414px, 100%);
        height: min(868px, 100%);
        padding: 10px;
        border: 2px solid var(--chart-3);
        border-radius: 3rem;
        background: var(--card);
        box-shadow: var(--shadow-hover);
      }
      .phone iframe {
        border-radius: 2.4rem;
      }

      @media (max-width: 560px) {
        .bar {
          gap: 8px;
          padding: 0 12px;
        }
        .switch button span {
          display: none;
        }
        /* The picker needs the room more than the title, which stays for
           screen readers. */
        .title {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }
        .screen {
          flex: 1;
        }
        .screen select {
          max-width: none;
        }
        .view.mobile {
          padding: 0;
        }
        .phone {
          width: 100%;
          height: 100%;
          padding: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .phone iframe {
          border-radius: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .switch button,
        .screen select {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a
        class="mark"
        href="/"
        aria-label="Open AIQ home"
        title="Open AIQ home"
      >
        <!-- lucide's Wind (ISC licence), the same mark as the dashboard header. -->
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12.8 19.6A2 2 0 1 0 14 16H2" />
          <path d="M17.5 8a2.5 2.5 0 1 1 2 4H2" />
          <path d="M9.8 4.4A2 2 0 1 1 11 8H2" />
        </svg>
      </a>
      <div class="title">
        <h1>Open AIQ prototype</h1>
        <p>Mock data, no sign-in. Nothing you do here is saved.</p>
      </div>
      <div
        class="switch"
        role="radiogroup"
        aria-label="Platform"
      >
        <button
          type="button"
          role="radio"
          data-view="web"
          aria-checked="true"
          title="Web dashboard"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="2"
              y="4"
              width="20"
              height="13"
              rx="2"
            />
            <path d="M8 21h8M12 17v4" />
          </svg>
          <span>Web</span>
        </button>
        <button
          type="button"
          role="radio"
          data-view="mobile"
          aria-checked="false"
          title="Mobile app"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="6"
              y="2"
              width="12"
              height="20"
              rx="2.5"
            />
            <path d="M11 18h2" />
          </svg>
          <span>Mobile</span>
        </button>
      </div>
      <div class="screen">
        <select
          id="screen"
          aria-label="Screen"
          title="Screen"
        ></select>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </div>
      <a
        class="open"
        id="open-full"
        href="web/"
        target="_blank"
        rel="noreferrer"
        aria-label="Open this view in its own tab"
        title="Open this view in its own tab"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </svg>
      </a>
    </header>

    <main>
      <section
        class="view web"
        data-view="web"
        aria-label="Web dashboard"
      ></section>
      <section
        class="view mobile"
        data-view="mobile"
        aria-label="Mobile app"
        hidden
      >
        <div class="phone"></div>
      </section>
    </main>

    <script>
      // One switch flips between the two prototypes, and the Screen picker
      // opens a page inside the active one. Each prototype loads the first time
      // you open it and keeps its place when you switch away and back.
      //
      // The hash keeps your place in links: #web and #mobile (the docs link to
      // these), or #web/<screen> and #mobile/<screen>, e.g. #mobile/account.
      const SCREENS = {
        web: [
          { key: 'dashboard', label: 'Dashboard', src: 'web/app' },
          { key: 'monitor', label: 'Monitor', src: 'web/app/devices/dev-garden' },
          { key: 'monitor-new', label: 'Monitor (no readings)', src: 'web/app/devices/dev-new' },
          {
            key: 'monitor-settings',
            label: 'Monitor settings',
            src: 'web/app/devices/dev-garden/settings',
          },
          { key: 'account', label: 'Account', src: 'web/app/account' },
          { key: 'landing', label: 'Landing', src: 'web/' },
          { key: 'map', label: 'Map', src: 'web/map' },
          { key: 'public-monitor', label: 'Public monitor', src: 'web/devices/dev-balcony' },
          { key: 'sign-in', label: 'Sign in', src: 'web/sign-in' },
          { key: 'playground', label: 'Playground', src: 'web/playground' },
        ],
        // The app's gallery reads ?screen=<key> to pick its first screen.
        mobile: [
          ['gallery', 'Gallery'],
          ['monitors', 'Monitors'],
          ['monitor', 'Monitor'],
          ['monitor-new', 'Monitor (no readings)'],
          ['monitor-logs', 'Logs'],
          ['monitor-settings', 'Monitor settings'],
          ['settings', 'App settings'],
          ['account', 'Account'],
        ].map(([key, label]) => ({ key, label, src: `mobile/?screen=${key}` })),
      }
      const TITLES = { web: 'Web dashboard prototype', mobile: 'Mobile app prototype' }
      const WEB_BASE = new URL('web/', location.href).pathname

      const buttons = document.querySelectorAll('.switch button')
      const picker = document.getElementById('screen')
      const openFull = document.getElementById('open-full')
      // Each platform starts on its first screen. After that, `loaded` holds
      // the screen its frame shows (null for a page that isn't in the list),
      // so switching platforms never reloads a frame.
      const DEFAULTS = { web: 'dashboard', mobile: 'gallery' }
      const loaded = { web: null, mobile: null }
      const frames = {}
      let active = null

      const screenFor = (view, key) => SCREENS[view].find((screen) => screen.key === key)

      // The web prototype's scenario (?scenario=), so a new screen keeps it.
      function webScenario() {
        try {
          return new URL(frames.web.contentWindow.location.href).searchParams.get('scenario')
        } catch {
          return null
        }
      }

      function srcFor(view, key) {
        const { src } = screenFor(view, key)
        const scenario = view === 'web' && frames.web ? webScenario() : null
        return scenario ? `${src}?scenario=${encodeURIComponent(scenario)}` : src
      }

      function fillPicker(view) {
        // Shown when you've followed a link to a page that isn't listed.
        const other = new Option('Another page', '')
        other.disabled = true
        other.hidden = true
        picker.replaceChildren(
          ...SCREENS[view].map(({ key, label }) => new Option(label, key)),
          other,
        )
      }

      function reflect(view, href) {
        picker.value = loaded[view] ?? ''
        openFull.href = href
        const hash = loaded[view] ? `#${view}/${loaded[view]}` : `#${view}`
        if (location.hash !== hash) history.replaceState(null, '', hash)
      }

      // When you follow a link inside the web prototype, the picker follows.
      function syncFromWebFrame() {
        let url
        try {
          url = new URL(frames.web.contentWindow.location.href)
        } catch {
          return
        }
        if (url.protocol === 'about:') return
        const path = url.pathname.startsWith(WEB_BASE) ? url.pathname.slice(WEB_BASE.length) : null
        const screen = SCREENS.web.find((item) => item.src === `web/${path}`)
        loaded.web = screen?.key ?? null
        if (active === 'web') reflect('web', url.href)
      }

      // Show a platform, and a screen on it when `key` names one. Without a
      // screen, the platform keeps whatever its frame is showing.
      function show(view, key) {
        if (!SCREENS[view]) view = 'web'
        if (!screenFor(view, key)) key = null

        for (const button of buttons) {
          const checked = button.dataset.view === view
          button.setAttribute('aria-checked', String(checked))
          button.tabIndex = checked ? 0 : -1
        }
        for (const section of document.querySelectorAll('.view')) {
          section.hidden = section.dataset.view !== view
        }

        const fresh = !frames[view]
        if (fresh) {
          frames[view] = document.createElement('iframe')
          frames[view].title = TITLES[view]
        }
        if (key ? key !== loaded[view] : fresh) {
          key ??= DEFAULTS[view]
          frames[view].src = srcFor(view, key)
          loaded[view] = key
        }
        if (fresh) {
          // Attach after setting src, so the frame never loads a blank page.
          const section = document.querySelector(`.view[data-view="${view}"]`)
          const host = section.querySelector('.phone') ?? section
          if (view === 'web') frames.web.addEventListener('load', syncFromWebFrame)
          host.append(frames[view])
        }

        if (active !== view) fillPicker(view)
        active = view
        reflect(view, frames[view].getAttribute('src'))
      }

      function showHash() {
        const [view, key] = location.hash.slice(1).split('/')
        show(view, key)
      }

      for (const button of buttons) {
        button.addEventListener('click', () => show(button.dataset.view))
        button.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return
          const other = [...buttons].find((b) => b !== button)
          other.focus()
          show(other.dataset.view)
        })
      }
      picker.addEventListener('change', () => show(active, picker.value))
      // Open what you're looking at, even after following links inside it.
      openFull.addEventListener('click', () => {
        try {
          openFull.href = frames[active].contentWindow.location.href
        } catch {
          /* not loaded yet, or another origin: keep the picked screen */
        }
      })
      window.addEventListener('hashchange', showHash)
      showHash()
    </script>
  </body>
</html>
