<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="robots"
      content="noindex"
    />
    <meta
      name="description"
      content="Try the Open AIQ web dashboard and mobile app with mock data. No sign-in needed."
    />
    <title>Open AIQ prototype</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <!-- Copied from src/styles/tokens.css at build time, so colors stay in step. -->
    <link
      rel="stylesheet"
      href="tokens.css"
    />
    <script>
      // Follow the system theme with the same `.dark` class the dashboard uses.
      const dark = window.matchMedia('(prefers-color-scheme: dark)')
      const applyTheme = () => document.documentElement.classList.toggle('dark', dark.matches)
      applyTheme()
      dark.addEventListener('change', applyTheme)
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font:
          15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      a {
        color: inherit;
      }

      /* The top bar follows the app shell: mark, title, then one control. */
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: var(--background);
      }
      .mark {
        display: grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      .title {
        flex: 1;
        min-width: 0;
      }
      .title h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title p {
        margin: 0;
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .switch {
        display: flex;
        flex: none;
        padding: 3px;
        border-radius: 999px;
        background: var(--muted);
      }
      .switch button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        transition:
          background-color 0.2s,
          color 0.2s;
      }
      .switch button[aria-checked='true'] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: var(--shadow-rest);
      }
      .switch button:focus-visible,
      .open:focus-visible,
      .mark:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--ring) 50%, transparent);
        outline-offset: 2px;
      }
      .switch svg {
        width: 16px;
        height: 16px;
      }

      .open {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        color: var(--muted-foreground);
      }
      .open:hover {
        background: var(--muted);
        color: var(--foreground);
      }

      main {
        flex: 1;
        min-height: 0;
        position: relative;
        background:
          radial-gradient(
            circle at 0% 0%,
            color-mix(in srgb, var(--chart-1) 9%, transparent),
            transparent 40%
          ),
          radial-gradient(
            circle at 100% 100%,
            color-mix(in srgb, var(--chart-2) 9%, transparent),
            transparent 40%
          );
      }
      .view {
        position: absolute;
        inset: 0;
      }
      main .view[hidden] {
        display: none;
      }
      .view iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--background);
      }

      /* Mobile sits in a phone-sized frame, scaled to fit the window. */
      .view.mobile {
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .phone {
        /* A 390 × 844 screen inside a 10px bezel and 2px outline. On short
           windows the phone gets shorter, never narrower. */
        width: min(414px, 100%);
        height: min(868px, 100%);
        padding: 10px;
        border: 2px solid var(--chart-3);
        border-radius: 3rem;
        background: var(--card);
        box-shadow: var(--shadow-hover);
      }
      .phone iframe {
        border-radius: 2.4rem;
      }

      @media (max-width: 560px) {
        .switch button span {
          display: none;
        }
        .title p {
          display: none;
        }
        .view.mobile {
          padding: 0;
        }
        .phone {
          width: 100%;
          height: 100%;
          padding: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .phone iframe {
          border-radius: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .switch button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a
        class="mark"
        href="/"
        aria-label="Open AIQ home"
        title="Open AIQ home"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="4.5"
            width="18"
            height="15"
            rx="4.5"
          />
          <path d="M9.5 10.5v.01M14.5 10.5v.01" />
          <path d="M9.5 13.5q2.5 2 5 0" />
        </svg>
      </a>
      <div class="title">
        <h1>Open AIQ prototype</h1>
        <p>Mock data, no sign-in. Nothing you do here is saved.</p>
      </div>
      <div
        class="switch"
        role="radiogroup"
        aria-label="Platform"
      >
        <button
          type="button"
          role="radio"
          data-view="web"
          aria-checked="true"
          title="Web dashboard"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="2"
              y="4"
              width="20"
              height="13"
              rx="2"
            />
            <path d="M8 21h8M12 17v4" />
          </svg>
          <span>Web</span>
        </button>
        <button
          type="button"
          role="radio"
          data-view="mobile"
          aria-checked="false"
          title="Mobile app"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="6"
              y="2"
              width="12"
              height="20"
              rx="2.5"
            />
            <path d="M11 18h2" />
          </svg>
          <span>Mobile</span>
        </button>
      </div>
      <a
        class="open"
        id="open-full"
        href="web/"
        target="_blank"
        rel="noreferrer"
        aria-label="Open this view in its own tab"
        title="Open this view in its own tab"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </svg>
      </a>
    </header>

    <main>
      <section
        class="view web"
        data-view="web"
        aria-label="Web dashboard"
      ></section>
      <section
        class="view mobile"
        data-view="mobile"
        aria-label="Mobile app"
        hidden
      >
        <div class="phone"></div>
      </section>
    </main>

    <script>
      // One switch flips between the two prototypes. Each loads the first time
      // you open it and keeps its place when you switch away and back.
      const SOURCES = { web: 'web/app', mobile: 'mobile/' }
      const buttons = document.querySelectorAll('.switch button')
      const openFull = document.getElementById('open-full')

      function show(view) {
        if (!SOURCES[view]) view = 'web'
        for (const button of buttons) {
          const checked = button.dataset.view === view
          button.setAttribute('aria-checked', String(checked))
          button.tabIndex = checked ? 0 : -1
        }
        for (const section of document.querySelectorAll('.view')) {
          const active = section.dataset.view === view
          section.hidden = !active
          const host = section.querySelector('.phone') ?? section
          if (active && !host.querySelector('iframe')) {
            const frame = document.createElement('iframe')
            frame.src = SOURCES[view]
            frame.title = view === 'web' ? 'Web dashboard prototype' : 'Mobile app prototype'
            host.append(frame)
          }
        }
        openFull.href = SOURCES[view]
        if (location.hash !== `#${view}`) history.replaceState(null, '', `#${view}`)
      }

      for (const button of buttons) {
        button.addEventListener('click', () => show(button.dataset.view))
        button.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return
          const other = [...buttons].find((b) => b !== button)
          other.focus()
          show(other.dataset.view)
        })
      }
      window.addEventListener('hashchange', () => show(location.hash.slice(1)))
      show(location.hash.slice(1))
    </script>
  </body>
</html>
